description: >
  Renders a Helm chart with `helm template` and scans the resulting Kubernetes resources against one Kubescape
  framework's security controls. Requires Helm on the PATH.
parameters:
  artifacts_dir:
    type: string
    default: ""
    description: >
      Directory of Kubescape artifacts created with `kubescape download artifacts --output <dir>`. When set,
      frameworks, control inputs, exceptions and attack tracks are loaded from it (--use-artifacts-from)
      instead of being downloaded, and Kubescape's update check is skipped, so the scan needs no network
      access. Leave empty to download them at scan time. Environment variables are expanded.
  chart:
    type: string
    description: >
      Helm chart to scan: anything `helm template` accepts, such as a chart directory, a packaged chart (.tgz
      file), a repo/chart reference to a repository added with `helm repo add`, or an oci:// URL. Environment
      variables are expanded.
  framework:
    type: enum
    enum:
      - "all"
      - "allcontrols"
      - "agentruntimehardening"
      - "armobest"
      - "devopsbest"
      - "mitre"
      - "nsa"
      - "security"
      - "soc2"
      - "cis-aks-t1.2.0"
      - "cis-aks-t1.8.0"
      - "cis-eks-t1.7.0"
      - "cis-eks-t1.8.0"
      - "cis-gke-v1.9.0"
      - "cis-v1.10.0"
      - "cis-v1.12.0"
    default: all
    description: >
      Framework to scan the chart with. Names match `kubescape list frameworks`, plus "all" and "security".
      Kubescape downloads frameworks from the kubescape/regolibrary releases at scan time, so the same set
      applies to Kubescape 3.x and 4.x. "agentruntimehardening" only covers Agent Sandbox resources
      (Sandbox, SandboxTemplate, WorkerPool); for charts without them Kubescape exits non-zero with
      "no resources found to scan".
  output_file:
    type: string
    description: >
      Path to the output file. Kubescape appends the format's extension when the name doesn't already end
      with it (Kubescape 4.x does this for every format), so use the matching extension to get the exact path:
      .json (json, gitlab-sast), .xml (junit), .sarif, .html, .pdf, .txt (pretty-printer, prometheus,
      github-actions), .csv, .md (markdown), .yaml (yaml, policyreport), .exceptions.json (exceptions).
  output_format:
    type: enum
    enum:
      - "pretty-printer"
      - "json"
      - "junit"
      - "prometheus"
      - "pdf"
      - "html"
      - "sarif"
      - "gitlab-sast"
      - "github-actions"
      - "yaml"
      - "csv"
      - "markdown"
      - "policyreport"
      - "exceptions"
    default: json
    description: >
      Format to use for the output file. Matches kubescape --format for posture scans. Image-scan-only formats
      (cyclonedx-json, spdx-json) are omitted because this command does not scan container images.
      Kubescape 3.x only supports pretty-printer, json, junit, prometheus, pdf, html and sarif; for the other
      formats it silently writes pretty-printer output.
  release_namespace:
    type: string
    default: kubescape-orb
    description: >
      Namespace passed to `helm template` (--namespace), which only sets .Release.Namespace while the chart is
      rendered. Nothing is deployed. Environment variables are expanded.
  verbose:
    type: boolean
    default: true
    description: >
      Include passed resources and controls in the report, not only failed ones (Kubescape's --verbose). It does
      not change Kubescape's log level. Kubescape 4.x writes passed resources to JSON reports either way. Defaults
      to true, unlike Kubescape itself, which reports only failures unless --verbose is given.
steps:
  - run:
      environment:
        PARAM_ARTIFACTS_DIR: << parameters.artifacts_dir >>
        PARAM_CHART: << parameters.chart >>
        PARAM_FRAMEWORK: << parameters.framework >>
        PARAM_OUTPUT_FILE: << parameters.output_file >>
        PARAM_OUTPUT_FORMAT: << parameters.output_format >>
        PARAM_RELEASE_NAMESPACE: << parameters.release_namespace >>
        PARAM_VERBOSE: << parameters.verbose >>
      name: Scan Helm Chart
      command: <<include(scripts/scan_helm_chart.sh)>>
