description: Installs the kubescape binary. This command should be invoked prior to calling any other commands.
parameters:
  caching:
    type: boolean
    default: true
    description: Cache the downloaded Kubescape binary between jobs using the selected version as the cache key.
  install_path:
    type: string
    default: "/home/circleci/bin"
    description: Path to a binary directory not requiring root access (no trailing slash).
  verify_checksums:
    type: enum
    enum: ["false", "known_versions", "strict"]
    default: strict
    description: >
      SHA-512 checksum verification of the downloaded Kubescape executable.
      "strict" (default) verifies the binary and fails if this orb has no checksum for the requested version.
      "known_versions" verifies versions this orb lists and installs unlisted versions unverified, with a warning.
      "false" disables verification entirely. Neither opt-out is recommended.
  version:
    type: string
    default: "4.0.15"
    description: Specify the semver of the Kubescape version to install.
steps:
  - when:
      condition: << parameters.caching >>
      steps:
        - restore_cache:
            key: kubescape-cache-<< parameters.version >>
  - run:
      name: Install Kubescape << parameters.version >>
      environment:
        PARAM_INSTALL_PATH: << parameters.install_path >>
        PARAM_VERIFY_CHECKSUMS: << parameters.verify_checksums >>
        PARAM_VERSION: << parameters.version >>
      command: << include(scripts/install.sh) >>
  - when:
      condition: << parameters.caching >>
      steps:
        - save_cache:
            key: kubescape-cache-<< parameters.version >>
            paths:
              - kubescape.tar.gz
  - run:
      name: Cleanup Kubescape Install
      command: rm kubescape.tar.gz
