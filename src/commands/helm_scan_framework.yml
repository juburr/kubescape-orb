description: >
  Scans a helm chart using one or more frameworks for compliance to security controls.
parameters:
  chart_path:
    type: string
    description: "Helm chart to scan."
  framework:
    type: enum
    enum:
      - "all"
      - "allcontrols"
      - "agentruntimehardening"
      - "armobest"
      - "devopsbest"
      - "mitre"
      - "nsa"
      - "security"
      - "soc2"
      - "cis-aks-t1.2.0"
      - "cis-aks-t1.8.0"
      - "cis-eks-t1.2.0"
      - "cis-eks-t1.7.0"
      - "cis-eks-t1.8.0"
      - "cis-gke-v1.9.0"
      - "cis-v1.10.0"
      - "cis-v1.12.0"
      - "cis-v1.23-t1.0.1"
    default: all
    description: >
      Framework to scan the chart with. Names match `kubescape list frameworks`.
      Older CIS identifiers (cis-eks-t1.2.0, cis-v1.23-t1.0.1) remain for
      pipelines that pin Kubescape 3.x; they are not present in 4.0.15.
  namespace:
    type: string
    default: kubescape-orb
    description: "Namespace to use when generating YAML files from Helm chart."
  output_file:
    type: string
    description: "Path to the output file."
  output_format:
    type: enum
    enum:
      - "pretty-printer"
      - "json"
      - "junit"
      - "prometheus"
      - "pdf"
      - "html"
      - "sarif"
      - "gitlab-sast"
      - "github-actions"
      - "yaml"
      - "csv"
      - "markdown"
      - "cyclonedx-json"
      - "spdx-json"
      - "policyreport"
      - "exceptions"
    default: json
    description: "Format to use for the output file. Matches kubescape --format."
  verbose:
    type: boolean
    default: true
steps:
  - run:
      environment:
        PARAM_CHART_PATH: << parameters.chart_path >>
        PARAM_FRAMEWORK: << parameters.framework >>
        PARAM_NAMESPACE: << parameters.namespace >>
        PARAM_OUTPUT_FILE: << parameters.output_file >>
        PARAM_OUTPUT_FORMAT: << parameters.output_format >>
        PARAM_VERBOSE: << parameters.verbose >>
      name: Scan Helm Chart
      command: <<include(scripts/helm_scan_framework.sh)>>
