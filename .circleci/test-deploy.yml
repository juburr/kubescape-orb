version: 2.1
orbs:
  # Your orb will be automatically injected here during the pipeline.
  # Reference your orb's jobs and commands below as they will exist when built.
  orb-tools: circleci/orb-tools@12.3
  # The orb definition is intentionally not included here. It will be injected into the pipeline.
  kubescape-orb: {}

# Use this tag to ensure test jobs always run,
# even though the downstream publish job will only run on release tags.
filters: &filters
  tags:
    only: /.*/

# Filter for release tags.
release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

commands:
  # Packages the chart from `helm create` for helm_scan_framework tests. Installs
  # a pinned, checksum-verified Helm first when the executor doesn't ship one,
  # outside the orb's default install path so tests still prove that the install
  # command puts kubescape on PATH by itself.
  setup-test-chart:
    steps:
      - run:
          name: Package Sample Helm Chart
          command: |
            if ! command -v helm > /dev/null; then
              HELM_VERSION="3.19.0"
              case "$(uname -m)" in
                x86_64) HELM_ARCH="amd64"; HELM_SHA256="a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496" ;;
                aarch64) HELM_ARCH="arm64"; HELM_SHA256="440cf7add0aee27ebc93fada965523c1dc2e0ab340d4348da2215737fc0d76ad" ;;
                *) echo "Unsupported architecture: $(uname -m)"; exit 1 ;;
              esac
              curl -fsSL -o /tmp/helm.tar.gz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-${HELM_ARCH}.tar.gz"
              echo "${HELM_SHA256}  /tmp/helm.tar.gz" | sha256sum -c -
              mkdir -p "${HOME}/.local/helm/bin"
              tar -xzf /tmp/helm.tar.gz -C /tmp "linux-${HELM_ARCH}/helm"
              mv "/tmp/linux-${HELM_ARCH}/helm" "${HOME}/.local/helm/bin/helm"
              echo "export PATH=\"${HOME}/.local/helm/bin:\${PATH}\"" >> "${BASH_ENV}"
              export PATH="${HOME}/.local/helm/bin:${PATH}"
            fi
            helm version
            mkdir -p "${HOME}/charts"
            cd "${HOME}/charts"
            helm create myservice
            helm package myservice
  # Scans the sample chart from setup-test-chart into /home/circleci/results.
  scan-test-chart:
    parameters:
      framework:
        type: string
        default: nsa
      output_format:
        type: string
      output_file:
        type: string
    steps:
      - kubescape-orb/helm_scan_framework:
          chart_path: /home/circleci/charts/myservice-0.1.0.tgz
          framework: << parameters.framework >>
          output_file: /home/circleci/results/<< parameters.output_file >>
          output_format: << parameters.output_format >>

jobs:
  # Create jobs to test the commands of your orbs.
  # You may want to add additional validation steps to ensure the commands are working as expected.
  command-test:
    docker:
      - image: cimg/base:current-22.04
    steps:
      - checkout
      - kubescape-orb/install
      - run:
          name: Verify Install
          command: command -v kubescape
  # Installs and runs the arm64 build on an Arm machine executor, where the
  # default install path isn't necessarily on PATH, then scans a chart with it.
  command-test-arm64:
    parameters:
      version:
        type: string
    machine:
      image: ubuntu-2204:current
    resource_class: arm.medium
    steps:
      - setup-test-chart
      - kubescape-orb/install:
          version: << parameters.version >>
      - run:
          name: Verify arm64 Install
          command: |
            test "$(uname -m)" = "aarch64"
            command -v kubescape
            kubescape version
      - kubescape-orb/helm_scan_framework:
          chart_path: /home/circleci/charts/myservice-0.1.0.tgz
          framework: nsa
          output_file: /home/circleci/results/nsa.json
          output_format: json
      - run:
          name: Verify Scan Results
          command: jq -e '.summaryDetails.frameworks | map(.name) | index("NSA")' /home/circleci/results/nsa.json
  # Runs helm_scan_framework with the frameworks and output formats pipelines
  # use most, on each supported Kubescape major version. The chart has failing
  # controls, so every scan step passing also shows scans don't gate by default.
  helm-scan-test:
    parameters:
      version:
        type: string
    docker:
      # Ships Helm 4, while the Arm job installs Helm 3.
      - image: cimg/deploy:2026.10
    steps:
      - checkout
      - setup-test-chart
      - kubescape-orb/install:
          version: << parameters.version >>
      - scan-test-chart: {framework: nsa, output_format: json, output_file: nsa.json}
      - scan-test-chart: {framework: mitre, output_format: json, output_file: mitre.json}
      - scan-test-chart: {framework: soc2, output_format: json, output_file: soc2.json}
      - scan-test-chart: {framework: cis-v1.12.0, output_format: json, output_file: cis-v1.12.0.json}
      - scan-test-chart: {framework: all, output_format: json, output_file: all.json}
      - scan-test-chart: {output_format: sarif, output_file: nsa.sarif}
      - scan-test-chart: {output_format: junit, output_file: nsa.xml}
      - scan-test-chart: {output_format: html, output_file: nsa.html}
      - scan-test-chart: {output_format: pdf, output_file: nsa.pdf}
      - scan-test-chart: {output_format: prometheus, output_file: nsa.prom.txt}
      - scan-test-chart: {output_format: pretty-printer, output_file: nsa.txt}
      - when:
          condition:
            matches: {pattern: "^v?4\\..*$", value: << parameters.version >>}
          steps:
            - scan-test-chart: {output_format: csv, output_file: nsa.csv}
            - scan-test-chart: {output_format: markdown, output_file: nsa.md}
            - scan-test-chart: {output_format: yaml, output_file: nsa.yaml}
            - scan-test-chart: {output_format: gitlab-sast, output_file: nsa.gitlab-sast.json}
            - scan-test-chart: {output_format: github-actions, output_file: nsa.github-actions.txt}
            - scan-test-chart: {output_format: policyreport, output_file: nsa.policyreport.yaml}
            - scan-test-chart: {output_format: exceptions, output_file: nsa.exceptions.json}
      - run:
          name: Verify Scan Results
          command: tests/verify_helm_scan_results.sh /home/circleci/results "<< parameters.version >>"
      - store_artifacts:
          path: /home/circleci/results
  # Scans with network access blocked, using artifacts downloaded beforehand
  # through the artifacts_path parameter, as documented under Running Offline.
  helm-scan-offline-test:
    parameters:
      version:
        type: string
    docker:
      - image: cimg/deploy:2026.10
    steps:
      - setup-test-chart
      - kubescape-orb/install:
          version: << parameters.version >>
      - run:
          name: Download Kubescape Artifacts
          command: kubescape download artifacts --output /home/circleci/kubescape-artifacts
      - run:
          name: Block Network Access
          command: |
            # Send all HTTP(S) traffic in later steps to a closed local port.
            for var in HTTP_PROXY HTTPS_PROXY http_proxy https_proxy; do
              echo "export ${var}=http://127.0.0.1:9" >> "${BASH_ENV}"
            done
            echo "unset NO_PROXY no_proxy" >> "${BASH_ENV}"
      - run:
          name: Confirm Network Access Is Blocked
          command: |
            if curl -sS --max-time 20 -o /dev/null https://github.com; then
              echo "github.com is still reachable"
              exit 1
            fi
      - kubescape-orb/helm_scan_framework:
          artifacts_path: /home/circleci/kubescape-artifacts
          chart_path: /home/circleci/charts/myservice-0.1.0.tgz
          framework: nsa
          output_file: /home/circleci/results/nsa.json
          output_format: json
      # Its image signature controls try to reach the registry and must not fail the scan.
      - kubescape-orb/helm_scan_framework:
          artifacts_path: /home/circleci/kubescape-artifacts
          chart_path: /home/circleci/charts/myservice-0.1.0.tgz
          framework: all
          output_file: /home/circleci/results/all.json
          output_format: json
      - run:
          name: Verify Scan Results
          command: |
            jq -e '.summaryDetails.frameworks | map(.name) | index("NSA")' /home/circleci/results/nsa.json
            jq -e '.summaryDetails.frameworks | length > 1' /home/circleci/results/all.json
  # The install contract runs in the setup workflow (config.yml); this checks
  # that parameter values reach circleci env subst on stdin.
  env-subst-test:
    docker:
      - image: cimg/base:current-22.04
    steps:
      - checkout
      - run:
          name: Test that parameter values reach circleci env subst on stdin
          command: bash tests/env_subst_test.sh

workflows:
  test-deploy:
    jobs:
      # Make sure to include "filters: *filters" in every test job you want to run as part of your deployment.
      # Test your orb's commands in a custom job and test your orb's jobs directly as a part of this workflow.
      - command-test:
          filters: *filters
      - env-subst-test:
          filters: *filters
      # Covers both release asset naming schemes (3.0.46 and earlier, 3.0.47 and later).
      - command-test-arm64:
          matrix:
            parameters:
              version: ["3.0.38", "4.0.15"]
          filters: *filters
      # 3.0.38 was the default before v0.4.0; 4.0.15 is the current default.
      - helm-scan-test:
          matrix:
            parameters:
              version: ["3.0.38", "4.0.15"]
          filters: *filters
      - helm-scan-offline-test:
          matrix:
            parameters:
              version: ["3.0.38", "4.0.15"]
          filters: *filters
      # The orb must be re-packed for publishing, and saved to the workspace.
      - orb-tools/pack:
          filters: *release-filters
      - orb-tools/publish:
          orb_name: juburr/kubescape-orb
          vcs_type: << pipeline.project.type >>
          pub_type: production
          # Ensure this job requires all test jobs and the pack job.
          requires:
            - orb-tools/pack
            - command-test
            - env-subst-test
            - command-test-arm64
            - helm-scan-test
            - helm-scan-offline-test
          context: orb-publishing
          filters: *release-filters
