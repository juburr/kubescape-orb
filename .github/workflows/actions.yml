# Tests the GitHub Actions in actions/ on GitHub's own runners, as
# .circleci/test-deploy.yml tests the orb's commands on CircleCI. Each job
# runs the actions from this checkout (uses: ./actions/...), so a pull
# request tests its own changes.
name: GitHub Actions

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the offline tests
        run: |
          for test in tests/actions_test.sh tests/install_test.sh tests/env_subst_test.sh tests/shell_conventions_test.sh tests/scan_helm_chart_test.sh; do
            echo "=== ${test}"
            bash "${test}"
          done

  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            machine: x86_64
          - runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      KS_SKIP_UPDATE_CHECK: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/install
      - name: Verify the install
        env:
          MACHINE: ${{ matrix.machine }}
        run: |
          version=$(grep -A3 '^  version:' src/commands/install.yml | sed -n 's/^    default: "\(.*\)"$/\1/p')
          [[ "$(uname -m)" == "${MACHINE}" ]]
          [[ "$(command -v kubescape)" == "${HOME}/bin/kubescape" ]]
          kubescape version | tee "${RUNNER_TEMP}/version.log"
          grep -F "${version}" "${RUNNER_TEMP}/version.log"
      # The first install saved the release to the cache, so this one
      # restores it. It goes to a directory of its own, which later steps
      # find first on the PATH.
      - uses: ./actions/install
        with:
          install_path: ${{ runner.temp }}/second
      - name: Verify the second install comes first on the PATH
        env:
          SECOND: ${{ runner.temp }}/second
        run: |
          [[ "$(command -v kubescape)" == "${SECOND}/kubescape" ]]
          kubescape version
      - name: Install an unlisted version, which must fail
        id: unlisted
        continue-on-error: true
        uses: ./actions/install
        with:
          version: 0.0.1
          caching: false
          install_path: ${{ runner.temp }}/unlisted
      - name: Verify it failed before installing anything
        env:
          OUTCOME: ${{ steps.unlisted.outcome }}
          UNLISTED: ${{ runner.temp }}/unlisted
        run: |
          [[ "${OUTCOME}" == failure ]]
          [[ ! -e "${UNLISTED}/kubescape" ]]

  # A fresh runner with the release's download hosts blocked installs from
  # the cache the install job saved, which only works if the cache is used.
  install-from-cache:
    needs: install
    runs-on: ubuntu-24.04
    env:
      KS_SKIP_UPDATE_CHECK: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Block the download hosts
        run: |
          echo "127.0.0.1 github.com objects.githubusercontent.com release-assets.githubusercontent.com" | sudo tee -a /etc/hosts
          if curl -sSf --max-time 10 -o /dev/null https://github.com; then
            echo "github.com is still reachable."
            exit 1
          fi
      - uses: ./actions/install
      - name: Verify the install
        run: |
          version=$(grep -A3 '^  version:' src/commands/install.yml | sed -n 's/^    default: "\(.*\)"$/\1/p')
          kubescape version | grep -F "${version}"

  # Runs scan_helm_chart with the frameworks and output formats pipelines use
  # most, on each supported Kubescape major version, as test-deploy.yml's
  # helm-scan-test does. The chart has failing controls, so every scan step
  # passing also shows scans don't gate by default.
  scan:
    strategy:
      fail-fast: false
      matrix:
        version: ["3.0.38", "4.0.15"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package the sample Helm chart
        run: bash tests/package_test_chart.sh charts
      - uses: ./actions/install
        with:
          version: ${{ matrix.version }}
      - uses: ./actions/scan_helm_chart
        with: {chart: charts/myservice-0.1.0.tgz, framework: nsa, output_format: json, output_file: results/nsa.json}
      - uses: ./actions/scan_helm_chart
        with: {chart: charts/myservice-0.1.0.tgz, framework: mitre, output_format: json, output_file: results/mitre.json}
      - uses: ./actions/scan_helm_chart
        with: {chart: charts/myservice-0.1.0.tgz, framework: soc2, output_format: json, output_file: results/soc2.json}
      - uses: ./actions/scan_helm_chart
        with: {chart: charts/myservice-0.1.0.tgz, framework: cis-v1.12.0, output_format: json, output_file: results/cis-v1.12.0.json}
      - uses: ./actions/scan_helm_chart
        with: {chart: charts/myservice-0.1.0.tgz, framework: all, output_format: json, output_file: results/all.json}
      - uses: ./actions/scan_helm_chart
        with: {chart: charts/myservice-0.1.0.tgz, framework: nsa, output_format: sarif, output_file: results/nsa.sarif}
      - uses: ./actions/scan_helm_chart
        with: {chart: charts/myservice-0.1.0.tgz, framework: nsa, output_format: junit, output_file: results/nsa.xml}
      - uses: ./actions/scan_helm_chart
        with: {chart: charts/myservice-0.1.0.tgz, framework: nsa, output_format: html, output_file: results/nsa.html}
      - uses: ./actions/scan_helm_chart
        with: {chart: charts/myservice-0.1.0.tgz, framework: nsa, output_format: pdf, output_file: results/nsa.pdf}
      - uses: ./actions/scan_helm_chart
        with: {chart: charts/myservice-0.1.0.tgz, framework: nsa, output_format: prometheus, output_file: results/nsa.prom.txt}
      - uses: ./actions/scan_helm_chart
        with: {chart: charts/myservice-0.1.0.tgz, framework: nsa, output_format: pretty-printer, output_file: results/nsa.txt}
      # Formats added in Kubescape 4.
      - if: startsWith(matrix.version, '4.')
        uses: ./actions/scan_helm_chart
        with: {chart: charts/myservice-0.1.0.tgz, framework: nsa, output_format: csv, output_file: results/nsa.csv}
      - if: startsWith(matrix.version, '4.')
        uses: ./actions/scan_helm_chart
        with: {chart: charts/myservice-0.1.0.tgz, framework: nsa, output_format: markdown, output_file: results/nsa.md}
      - if: startsWith(matrix.version, '4.')
        uses: ./actions/scan_helm_chart
        with: {chart: charts/myservice-0.1.0.tgz, framework: nsa, output_format: yaml, output_file: results/nsa.yaml}
      - if: startsWith(matrix.version, '4.')
        uses: ./actions/scan_helm_chart
        with: {chart: charts/myservice-0.1.0.tgz, framework: nsa, output_format: gitlab-sast, output_file: results/nsa.gitlab-sast.json}
      - if: startsWith(matrix.version, '4.')
        uses: ./actions/scan_helm_chart
        with: {chart: charts/myservice-0.1.0.tgz, framework: nsa, output_format: github-actions, output_file: results/nsa.github-actions.txt}
      - if: startsWith(matrix.version, '4.')
        uses: ./actions/scan_helm_chart
        with: {chart: charts/myservice-0.1.0.tgz, framework: nsa, output_format: policyreport, output_file: results/nsa.policyreport.yaml}
      - if: startsWith(matrix.version, '4.')
        uses: ./actions/scan_helm_chart
        with: {chart: charts/myservice-0.1.0.tgz, framework: nsa, output_format: exceptions, output_file: results/nsa.exceptions.json}
      - name: Verify the scan results
        env:
          VERSION: ${{ matrix.version }}
        run: bash tests/verify_helm_scan_results.sh results "${VERSION}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scan-results-${{ matrix.version }}
          path: results
          if-no-files-found: ignore

  # Installs and runs the arm64 build on an Arm runner, then scans a chart
  # with it, on both release asset naming schemes (3.0.46 and earlier, 3.0.47
  # and later).
  scan-arm64:
    strategy:
      fail-fast: false
      matrix:
        version: ["3.0.38", "4.0.15"]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package the sample Helm chart
        run: bash tests/package_test_chart.sh charts
      - uses: ./actions/install
        with:
          version: ${{ matrix.version }}
      - name: Verify the arm64 install
        env:
          KS_SKIP_UPDATE_CHECK: "true"
        run: |
          [[ "$(uname -m)" == aarch64 ]]
          command -v kubescape
          kubescape version
      - uses: ./actions/scan_helm_chart
        with: {chart: charts/myservice-0.1.0.tgz, framework: nsa, output_format: json, output_file: results/nsa.json}
      - name: Verify the scan results
        run: jq -e '.summaryDetails.frameworks | map(.name) | index("NSA")' results/nsa.json

  # Scans with network access blocked, using artifacts downloaded beforehand
  # through the artifacts_dir input, as documented under Running Offline.
  scan-offline:
    strategy:
      fail-fast: false
      matrix:
        version: ["3.0.38", "4.0.15"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package the sample Helm chart
        run: bash tests/package_test_chart.sh charts
      - uses: ./actions/install
        with:
          version: ${{ matrix.version }}
      - name: Download Kubescape artifacts
        run: kubescape download artifacts --output kubescape-artifacts
      - name: Block network access
        run: |
          # Send all HTTP(S) traffic in later steps to a closed local port.
          for var in HTTP_PROXY HTTPS_PROXY http_proxy https_proxy; do
            echo "${var}=http://127.0.0.1:9" >> "${GITHUB_ENV}"
          done
          echo "NO_PROXY=" >> "${GITHUB_ENV}"
          echo "no_proxy=" >> "${GITHUB_ENV}"
      - name: Confirm network access is blocked
        run: |
          if curl -sS --max-time 20 -o /dev/null https://github.com; then
            echo "github.com is still reachable"
            exit 1
          fi
      - uses: ./actions/scan_helm_chart
        with: {artifacts_dir: kubescape-artifacts, chart: charts/myservice-0.1.0.tgz, framework: nsa, output_format: json, output_file: results/nsa.json}
      # Its image signature controls try to reach the registry and must not fail the scan.
      - uses: ./actions/scan_helm_chart
        with: {artifacts_dir: kubescape-artifacts, chart: charts/myservice-0.1.0.tgz, framework: all, output_format: json, output_file: results/all.json}
      - name: Verify the scan results
        run: |
          jq -e '.summaryDetails.frameworks | map(.name) | index("NSA")' results/nsa.json
          jq -e '.summaryDetails.frameworks | length > 1' results/all.json
